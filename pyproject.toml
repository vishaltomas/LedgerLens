[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "pandas",
    "pyarrow",
    "fastapi",
    "requests",
    "pymupdf",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[tool.setuptools]
py-modules = ["config"]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
